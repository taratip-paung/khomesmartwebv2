# /etc/nginx/sites-available/beconnected  (CT 1320, behind HAProxy 10.10.13.13 which does TLS)
server {
    listen 80 default_server;
    server_name beconnectedcm.com www.beconnectedcm.com _;
    root /var/www/beconnected-web/dist;
    index index.html;

    # real client IP comes from HAProxy
    set_real_ip_from 10.10.13.13;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hashed assets: cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # contact form -> node service
    location /api/ {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        client_max_body_size 32k;
    }

    # /solar: same SPA, but its own title + share image (dist/solar/index.html, built by solar-server/solarOgPage.mjs)
    location = /solar {
        add_header Cache-Control "no-cache";
        try_files /solar/index.html /index.html;
    }

    # SPA
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
